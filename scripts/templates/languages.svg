<svg width="360" height="210" xmlns="http://www.w3.org/2000/svg">
<style>
svg{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:21px;
--ink:#37352f;--dim:#5f5e5a;--line:#e9e9e7;--line2:#d3d2ce;--card:#ffffff;--edge:#ffffff;--accent:#0072e3;--accent-ink:#0a54ba}
@media(prefers-color-scheme:dark){svg{--ink:#ececec;--dim:#a3a3a3;--line:#2a2a2a;--line2:#3a3a3a;--card:#181818;--edge:rgb(255 255 255/.06);--accent-ink:#6ba4ff}}
#bg{fill:var(--card);stroke:var(--line);stroke-width:1px}
#edge{fill:none;stroke:var(--edge);stroke-width:1px}
.k{margin:0 0 8px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
foreignObject{width:318px;height:176px}
.k{margin-bottom:12px}
.progress{display:flex;height:8px;overflow:hidden;background:var(--line);border-radius:4px;margin-bottom:14px}
.progress-item{border-right:2px solid var(--card);min-width:2px}
.progress-item:last-child{border-right:0}
ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
li{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border-radius:4px;border:1px solid var(--line2);font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;line-height:18px;letter-spacing:.06em;text-transform:uppercase}
li .lang{font-weight:500;color:var(--dim)}
li .percent{color:var(--accent-ink)}
div.ellipsis{height:176px;overflow:hidden}
</style>
<rect id="bg" x="5.5" y="5.5" width="349" height="199" rx="12"/>
<rect id="edge" x="6.5" y="6.5" width="347" height="197" rx="11"/>
<foreignObject x="23" y="21" width="318" height="176">
<div xmlns="http://www.w3.org/1999/xhtml" class="ellipsis">
<p class="k">Languages &#183; by file size</p>
<div class="progress">
{{ progress }}
</div>
<ul>
{{ lang_list }}
</ul>
</div>
</foreignObject>
</svg>
