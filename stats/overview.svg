<style>
svg{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:21px;
--ink:#37352f;--dim:#5f5e5a;--line:#e9e9e7;--line2:#d3d2ce;--card:#ffffff;--edge:#ffffff;--accent:#0072e3;--accent-ink:#0a54ba}
@media(prefers-color-scheme:dark){svg{--ink:#ececec;--dim:#a3a3a3;--line:#2a2a2a;--line2:#3a3a3a;--card:#181818;--edge:rgb(255 255 255/.06);--accent-ink:#6ba4ff}}
#bg{fill:var(--card);stroke:var(--line);stroke-width:1px}
#edge{fill:none;stroke:var(--edge);stroke-width:1px}
.k{margin:0 0 8px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
foreignObject{width:318px;height:168px}
table{width:100%;border-collapse:collapse}
tr+tr td{border-top:1px solid var(--line)}
td{padding:0;font-size:12px;line-height:20px;color:var(--dim)}
td.v{text-align:right;font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.i{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);color:var(--accent-ink);margin-right:10px;margin-top:-1px}
.i svg{width:11px;height:11px}
</style>
