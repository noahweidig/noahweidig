<span style="background-color: #EB8CEB; width: 0.014%;" class="progress-item"></span>
<span style="background-color: #384d54; width: 0.012%;" class="progress-item"></span>
<span style="background-color: #FFDAB3; width: 0.001%;" class="progress-item"></span>
<span style="background-color: #358a5b; width: 0.000%;" class="progress-item"></span>
</div>
<ul>
<li style="background: color-mix(in srgb, #3178c6 16%, var(--surface));">
  <span class="lang">TypeScript</span>
  <span class="percent">21.1%</span>
</li>
<li style="background: color-mix(in srgb, #198CE7 16%, var(--surface));">
