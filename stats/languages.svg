<svg width="360" height="210" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 21px;
}

#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: #ffffff;
  stroke: #e9e9e7;
  stroke-width: 1px;
  rx: 12px;
  ry: 12px;
}


foreignObject {
  width: calc(100% - 10px - 32px);
  height: calc(100% - 10px - 24px);
}

h2 {
  margin-top: 0;
  margin-bottom: 0.75em;
  line-height: 24px;
  font-size: 16px;
  font-weight: 600;
  color: #37352f;
  fill: #37352f;
}


ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
}

li {
  display: inline-flex;
  font-size: 12px;
  margin-right: 1ch;
  align-items: center;
  flex-wrap: nowrap;
  transform: translateX(-500%);
  animation: slideIn 2s ease-in-out forwards;
}

@keyframes slideIn {
  to {
    transform: translateX(0);
  }
}

div.ellipsis {
  height: 176px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.octicon {
  fill: #5f5e5a;
  margin-right: 0.5ch;
  vertical-align: top;
}


.progress {
  display: flex;
  height: 8px;
  overflow: hidden;
  background-color: #e9e9e7;
  border-radius: 4px;
  outline: 1px solid transparent;
  margin-bottom: 1em;
}


.progress-item {
  outline: 2px solid #ffffff;
  border-collapse: collapse;
}


.lang {
  font-weight: 600;
  margin-right: 4px;
  color: #37352f;
}


.percent {
  color: #5f5e5a
}

@media (prefers-color-scheme: dark) {
  #background {
    fill: #181818;
    stroke: #2a2a2a;
    stroke-width: 1px;
  }
  h2 {
    color: #ececec;
    fill: #ececec;
  }
  .octicon {
    color: #a3a3a3;
    fill: #a3a3a3;
  }
  .progress {
    background-color: #2a2a2a;
  }
  .progress-item {
    outline: 2px solid #181818;
  }
  .lang {
    color: #ececec;
  }
  .percent {
    color: #a3a3a3;
  }
}
</style>
<g>
