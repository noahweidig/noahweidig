<span style="background-color: #f34b7d; width: 0.284%;" class="progress-item"></span>
<span style="background-color: #336790; width: 0.239%;" class="progress-item"></span>
<span style="background-color: #427819; width: 0.210%;" class="progress-item"></span>
<span style="background-color: #a91e50; width: 0.088%;" class="progress-item"></span>
<span style="background-color: #ff3e00; width: 0.032%;" class="progress-item"></span>
<span style="background-color: #41b883; width: 0.022%;" class="progress-item"></span>
