<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Spatial analysis. Real insights, answers, impact, clarity, action.">
<title>Spatial analysis. Real insights, answers, impact, clarity, action.</title>
<style>
:root{--ink:#14161a;--dim:#565d6b;--line:#e2e2e2;--accent:#0a54ba;--moss:#0f6220;--violet:#7237ae;--yellow:#8c5d00;--red:#b8142d;--mix:18%;--base:#fafafa}
@media(prefers-color-scheme:dark){:root{--ink:#e9ecf2;--dim:#99a1b1;--line:#23272f;--accent:#6ba4ff;--moss:#68ce7e;--violet:#ad6ded;--yellow:#ffc95e;--red:#ff6b78;--base:#101216}}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.t{font-weight:700;font-size:76px;fill:var(--ink)}
.l{font-weight:400;font-size:17px;fill:var(--dim)}
.k{font-weight:600;font-size:13px;letter-spacing:.14em;fill:var(--dim)}
.accent{fill:var(--accent)}.moss{fill:var(--moss)}.violet{fill:var(--violet)}.yellow{fill:var(--yellow)}.red{fill:var(--red)}
.pill{animation:pw 11.0s infinite;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.track{animation:tr 11.0s infinite;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.dot{animation:dt 11.0s infinite;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.fillc{animation:fc 11.0s infinite}
@keyframes tr{0%{transform:translateY(0.0px)}14.5%{transform:translateY(0.0px)}20%{transform:translateY(-96.0px)}34.5%{transform:translateY(-96.0px)}40%{transform:translateY(-192.0px)}54.5%{transform:translateY(-192.0px)}60%{transform:translateY(-288.0px)}74.5%{transform:translateY(-288.0px)}80%{transform:translateY(-384.0px)}94.5%{transform:translateY(-384.0px)}100%{transform:translateY(-480.0px)}}
@keyframes pw{0%{width:323.9px}14.5%{width:323.9px}20%{width:347.1px}34.5%{width:347.1px}40%{width:289.0px}54.5%{width:289.0px}60%{width:267.5px}74.5%{width:267.5px}80%{width:265.0px}94.5%{width:265.0px}100%{width:323.9px}}
@keyframes dt{0%{transform:translateX(0.0px)}14.5%{transform:translateX(0.0px)}20%{transform:translateX(23.1px)}34.5%{transform:translateX(23.1px)}40%{transform:translateX(-34.9px)}54.5%{transform:translateX(-34.9px)}60%{transform:translateX(-56.4px)}74.5%{transform:translateX(-56.4px)}80%{transform:translateX(-59.0px)}94.5%{transform:translateX(-59.0px)}100%{transform:translateX(0.0px)}}
@media(prefers-reduced-motion:reduce){.pill,.track,.dot,.f0,.f1,.f2,.f3,.f4{animation:none}.f0{opacity:1}}
.f0{animation:o0 11.0s infinite;opacity:0}
@keyframes o0{0%{opacity:1}14.5%{opacity:1}16.5%{opacity:0}98%{opacity:0}100%{opacity:1}}
.f1{animation:o1 11.0s infinite;opacity:0}
@keyframes o1{0%{opacity:0}18%{opacity:0}22%{opacity:1}34.5%{opacity:1}36.5%{opacity:0}100%{opacity:0}}
.f2{animation:o2 11.0s infinite;opacity:0}
@keyframes o2{0%{opacity:0}38%{opacity:0}42%{opacity:1}54.5%{opacity:1}56.5%{opacity:0}100%{opacity:0}}
.f3{animation:o3 11.0s infinite;opacity:0}
@keyframes o3{0%{opacity:0}58%{opacity:0}62%{opacity:1}74.5%{opacity:1}76.5%{opacity:0}100%{opacity:0}}
.f4{animation:o4 11.0s infinite;opacity:0}
@keyframes o4{0%{opacity:0}78%{opacity:0}82%{opacity:1}94.5%{opacity:1}96.5%{opacity:0}100%{opacity:0}}
</style>
<defs><clipPath id="c"><rect class="pill" x="348.1" y="151.0" width="323.9" height="96" rx="48.0"/></clipPath></defs>
<text class="t" x="172.1" y="118" textLength="555.8" lengthAdjust="spacing">Spatial analysis.</text>
<text class="t" x="182.5" y="222" textLength="147.6" lengthAdjust="spacing">Real</text>
<rect class="pill f0" x="348.1" y="151.0" width="323.9" height="96" rx="48.0" style="fill:color-mix(in srgb,var(--accent) 18%,var(--base))"/><rect class="pill f1" x="348.1" y="151.0" width="347.1" height="96" rx="48.0" style="fill:color-mix(in srgb,var(--moss) 18%,var(--base))"/><rect class="pill f2" x="348.1" y="151.0" width="289.0" height="96" rx="48.0" style="fill:color-mix(in srgb,var(--violet) 18%,var(--base))"/><rect class="pill f3" x="348.1" y="151.0" width="267.5" height="96" rx="48.0" style="fill:color-mix(in srgb,var(--yellow) 18%,var(--base))"/><rect class="pill f4" x="348.1" y="151.0" width="265.0" height="96" rx="48.0" style="fill:color-mix(in srgb,var(--red) 18%,var(--base))"/>
<g clip-path="url(#c)"><g class="track"><text class="t accent" x="374.1" y="222.0" textLength="271.9" lengthAdjust="spacing">insights</text><text class="t moss" x="374.1" y="318.0" textLength="295.1" lengthAdjust="spacing">answers</text><text class="t violet" x="374.1" y="414.0" textLength="237.0" lengthAdjust="spacing">impact</text><text class="t yellow" x="374.1" y="510.0" textLength="215.5" lengthAdjust="spacing">clarity</text><text class="t red" x="374.1" y="606.0" textLength="213.0" lengthAdjust="spacing">action</text><text class="t accent" x="374.1" y="702.0" textLength="271.9" lengthAdjust="spacing">insights</text></g></g>
<circle class="dot" cx="689" cy="214.5" r="7.5" fill="var(--ink)"/>
<text class="l" x="113.7" y="282" textLength="672.7" lengthAdjust="spacing">I turn satellite imagery, fire perimeters, and messy field data into models people can</text>
<text class="l" x="86.4" y="308" textLength="727.2" lengthAdjust="spacing">actually decide something with, mostly around wildfire risk in the wildland-urban interface.</text>
</svg>