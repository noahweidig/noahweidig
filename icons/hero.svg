<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Spatial analysis. Real insights."><title>Spatial analysis. Real insights.</title><style>:root{--ink:#37352f;--dim:#5f5e5a;--faint:#6b6a65;--line:#d3d2ce;--accent:#0072e3;--accent-ink:#0a54ba;--logo:#2383e2}@media(prefers-color-scheme:dark){:root{--ink:#ececec;--dim:#a3a3a3;--faint:#8f8f8f;--line:#3a3a3a;--accent-ink:#6ba4ff;--logo:#5aa0ff}}.s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="385.9" y1="0" x2="657.71" y2="40"><stop offset="0" stop-color="var(--accent-ink)"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--accent-ink) 70%,var(--ink))"/></linearGradient></defs><text class="s" x="450" y="120" text-anchor="middle" font-size="76" font-weight="600" letter-spacing="-2.28" fill="var(--ink)">Spatial analysis.</text><text class="s" x="450" y="206" text-anchor="middle" font-size="76" font-weight="600" letter-spacing="-2.28" fill="var(--ink)">Real <tspan fill="url(#g)">insights</tspan>.</text><text class="s" x="450" y="268" text-anchor="middle" font-size="17" fill="var(--dim)">I turn satellite imagery, fire perimeters, and messy field data into models people can</text><text class="s" x="450" y="294" text-anchor="middle" font-size="17" fill="var(--dim)">actually decide something with, mostly around wildfire risk in the wildland-urban interface.</text></svg>
