name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Make background transparent
        run: sed -i -E 's#<rect x="0" y="0" width="[0-9]+" height="[0-9]+" class="fill-bg"[^>]*>(</rect>)?##' profile-3d-contrib/*.svg
      - name: Match site font
        run: |
          sed -i -E 's#font-family: "Ubuntu", "Helvetica", "Arial", sans-serif;#font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;#; s#\.fill-fg \{ fill: \#eeeeff; \}#.fill-fg { fill: \#ececec; }#; s#\.fill-weak \{ fill: \#aaaaaa; \}#.fill-weak { fill: \#a3a3a3; }#' profile-3d-contrib/*.svg
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply site palette
        run: node scripts/restyle-3d.js
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            for i in 1 2 3 4 5; do
              git push && exit 0
              sleep $((i * 5))
              git pull --rebase origin "$GITHUB_REF_NAME"
            done
            exit 1
          fi
